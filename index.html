<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>词稿</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f6f7f9;
        color: #20242b;
      }
      .boot-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font:
          14px "Microsoft YaHei UI",
          sans-serif;
      }
      .boot-screen p {
        margin: 0;
        color: #626b78;
      }
      .boot-screen button {
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #18191c;
          color: #eee;
        }
        .boot-screen p {
          color: #b5bbc5;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
